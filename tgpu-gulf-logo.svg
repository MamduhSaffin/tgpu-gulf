<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">TGPU Gulf</title>
  <desc id="desc">Official TGPU Gulf logo connecting Malaysia and the GCC in navy, green and gold.</desc>
  <rect width="700" height="700" rx="70" fill="#fff"/>
  <!-- gold Gulf arch -->
  <path d="M208 235C268 188 318 126 350 60c32 66 82 128 142 175" fill="none" stroke="#d5a32f" stroke-width="25" stroke-linecap="round"/>
  <!-- palm -->
  <g fill="none" stroke="#057467" stroke-linecap="round" stroke-linejoin="round">
    <path d="M515 206c-2 84-14 151-35 207" stroke-width="17"/>
    <path d="M508 207c20-41 49-57 86-50-21 19-43 33-67 40 27-5 51 3 72 24-32 13-59 10-82-9" stroke-width="13"/>
    <path d="M510 208c-37-28-70-32-101-10 26 8 51 14 77 18-26 0-48 10-66 30 33 5 61-3 83-24" stroke-width="13"/>
  </g>
  <text x="302" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="900" letter-spacing="1" fill="#06345f">TGPU</text>
  <path d="M218 394c62-32 124-48 190-47" fill="none" stroke="#06345f" stroke-width="16" stroke-linecap="round"/>
  <text x="420" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="122" font-weight="700" fill="#d5a32f">Gulf</text>
  <text x="350" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="8" fill="#06345f">MALAYSIA <tspan fill="#087d79">↔</tspan> GCC</text>
  <text x="350" y="615" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#06345f">People <tspan fill="#d5a32f">●</tspan> Opportunities <tspan fill="#d5a32f">●</tspan> Collaboration</text>
</svg>
