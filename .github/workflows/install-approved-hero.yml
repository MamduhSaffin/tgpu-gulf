name: Install approved TGPU Gulf hero banner
on:
  push:
    branches: [chatgpt-approved-banner-20260922]
    paths:
      - '.banner-src/**'
      - '.github/scripts/install-approved-hero.py'
      - '.github/workflows/install-approved-hero.yml'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-approved-banner-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/install-approved-hero.py
      - name: Commit installed banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Install approved TGPU Gulf hero banner"
          git push origin HEAD:chatgpt-approved-banner-20260922
