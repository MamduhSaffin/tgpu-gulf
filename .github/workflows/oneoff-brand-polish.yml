name: One-off TGPU Gulf brand polish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  polish-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate transparent logo and refined hero image
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageEnhance
          from collections import deque
          import os, math, base64

          def black_alpha_remove(src, hard=5, soft=105, pad=18):
              im = Image.open(src).convert('RGBA')
              w, h = im.size
              pix = im.load()
              dark = [[False]*w for _ in range(h)]
              for y in range(h):
                  for x in range(w):
                      r,g,b,a = pix[x,y]
                      dark[y][x] = max(r,g,b) < soft
              bg = [[False]*w for _ in range(h)]
              q = deque()
              for x in range(w):
                  if dark[0][x]: q.append((x,0)); bg[0][x]=True
                  if dark[h-1][x]: q.append((x,h-1)); bg[h-1][x]=True
              for y in range(h):
                  if dark[y][0] and not bg[y][0]: q.append((0,y)); bg[y][0]=True
                  if dark[y][w-1] and not bg[y][w-1]: q.append((w-1,y)); bg[y][w-1]=True
              while q:
                  x,y = q.popleft()
                  for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                      if 0 <= nx < w and 0 <= ny < h and dark[ny][nx] and not bg[ny][nx]:
                          bg[ny][nx] = True
                          q.append((nx,ny))
              out = Image.new('RGBA', (w,h), (0,0,0,0))
              op = out.load()
              for y in range(h):
                  for x in range(w):
                      r,g,b,a = pix[x,y]
                      if bg[y][x]:
                          m = max(r,g,b)
                          na = int(max(0, min(255, (m-hard)/(soft-hard)*255)))
                          if na < 18: na = 0
                          op[x,y] = (r,g,b,na)
                      else:
                          op[x,y] = (r,g,b,a)
              a = out.getchannel('A').filter(ImageFilter.GaussianBlur(0.45))
              out.putalpha(a)
              bbox = out.getbbox()
              if bbox:
                  l,t,r,b = bbox
                  out = out.crop((max(0,l-pad), max(0,t-pad), min(w,r+pad), min(h,b+pad)))
              return out

          def fit(im, max_w=None, max_h=None):
              w,h = im.size
              scale = 1
              if max_w: scale = min(scale, max_w/w)
              if max_h: scale = min(scale, max_h/h)
              return im.resize((max(1,int(w*scale)), max(1,int(h*scale))), Image.LANCZOS)

          nav_src = 'tgpu-gulf-nav.jpg' if os.path.exists('tgpu-gulf-nav.jpg') else 'tgpu-gulf-brand.webp'
          nav = black_alpha_remove(nav_src)
          nav = fit(nav, max_w=680)
          nav.save('tgpu-gulf-nav-transparent.webp', quality=82, method=6)
          with open('tgpu-gulf-nav-transparent.webp','rb') as f:
              b64 = base64.b64encode(f.read()).decode('ascii')
          vw, vh = nav.size
          with open('tgpu-gulf-header.svg','w',encoding='utf-8') as f:
              f.write(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {vw} {vh}" role="img" aria-labelledby="title desc"><title id="title">TGPU Gulf</title><desc id="desc">TGPU Gulf — Malaysia ↔ GCC</desc><image width="{vw}" height="{vh}" preserveAspectRatio="xMidYMid meet" href="data:image/webp;base64,{b64}"/></svg>')

          logo = black_alpha_remove('tgpu-gulf-brand.webp')
          rgb = logo.convert('RGB')
          rgb = ImageEnhance.Brightness(rgb).enhance(1.12)
          rgb = ImageEnhance.Color(rgb).enhance(1.14)
          rgb = ImageEnhance.Contrast(rgb).enhance(1.05)
          logo = Image.merge('RGBA', (*rgb.split(), logo.getchannel('A')))

          W,H = 1200,630
          bg = Image.new('RGBA',(W,H),(5,35,25,255))
          p = bg.load()
          for y in range(H):
              for x in range(W):
                  t = (x/W*0.42 + y/H*0.58)
                  r = int(5*(1-t)+19*t)
                  g = int(35*(1-t)+79*t)
                  b = int(25*(1-t)+55*t)
                  d = (((x-600)/650)**2 + ((y-285)/330)**2) ** 0.5
                  glow = max(0,1-d) ** 1.7
                  r = int(r*(1-glow*.34)+21*(glow*.34))
                  g = int(g*(1-glow*.34)+100*(glow*.34))
                  b = int(b*(1-glow*.34)+70*(glow*.34))
                  p[x,y]=(r,g,b,255)
          draw = ImageDraw.Draw(bg,'RGBA')
          for i in range(-120,330,42):
              for j in range(-100,250,42):
                  draw.line([(i,j+21),(i+21,j),(i+42,j+21),(i+21,j+42),(i,j+21)], fill=(255,215,120,10), width=2)
          panel = Image.new('RGBA',(W,H),(0,0,0,0))
          pd = ImageDraw.Draw(panel,'RGBA')
          pd.rounded_rectangle((120,80,1080,555), radius=60, fill=(0,0,0,58))
          bg = Image.alpha_composite(bg, panel.filter(ImageFilter.GaussianBlur(45)))
          draw = ImageDraw.Draw(bg,'RGBA')
          for off, alpha, width in [(0,70,3),(52,38,2)]:
              pts=[(x, H-88-off+55*math.sin((x-130)/270)) for x in range(-50,W+51,20)]
              draw.line(pts, fill=(240,210,120,alpha), width=width)
          logo = fit(logo, max_w=1015, max_h=548)
          x=(W-logo.width)//2
          y=(H-logo.height)//2-2
          a=logo.getchannel('A')
          shadow=Image.new('RGBA',logo.size,(0,0,0,0))
          shadow.putalpha(a.filter(ImageFilter.GaussianBlur(13)).point(lambda v:int(v*.70)))
          bg.alpha_composite(shadow,(x+9,y+13))
          light=Image.new('RGBA',logo.size,(255,220,95,0))
          light.putalpha(a.filter(ImageFilter.GaussianBlur(18)).point(lambda v:int(v*.16)))
          bg.alpha_composite(light,(x,y))
          bg.alpha_composite(logo,(x,y))
          bg.convert('RGB').save('tgpu-gulf-brand.webp', quality=82, method=6)
          bg.convert('RGB').save('tgpu-gulf-share.jpg', quality=94, subsampling=2, optimize=True)
          PY

      - name: Commit refined assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tgpu-gulf-header.svg tgpu-gulf-brand.webp tgpu-gulf-share.jpg tgpu-gulf-nav-transparent.webp
          git commit -m "Polish transparent TGPU Gulf logo and hero branding" || echo "No changes to commit"
          git push || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
