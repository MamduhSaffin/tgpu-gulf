name: Apply TGPU Gulf contact cleanup safely

on:
  push:
    paths:
      - '.github/workflows/apply-contact-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the existing Gulf contact mapping to public source files only
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path
          source = Path('.github/workflows/normalize-public-contact.yml').read_text(encoding='utf-8')
          match = re.search(r"replacements = (\{.*?\})\n\n", source, re.S)
          if not match:
              raise SystemExit('Contact mapping not found')
          replacements = ast.literal_eval(match.group(1))
          changed=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts or (path.parts and path.parts[0]=='.github'):
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):
                  continue
              updated=text
              for old,new in replacements.items():
                  updated=updated.replace(old,new)
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit public-source changes only
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Gulf Contact Maintenance'
          git config user.email 'mamduh@tgpugulf.com'
          git add -- ':!.github/workflows/*'
          git commit -m 'Remove personal number and standardize TGPU Gulf contact'
          git push origin HEAD:main
