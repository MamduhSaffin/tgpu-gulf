name: Normalize TGPU Gulf public contact

on:
  push:
    paths:
      - '.github/workflows/normalize-public-contact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only the TGPU Gulf WhatsApp number
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '60129153527': '60128681339',
              '+60129153527': '+60128681339',
              '0129153527': '0128681339',
              '012-915 3527': '012-868 1339',
              '012 915 3527': '012 868 1339',
              '+60 12-915 3527': '+60 12-868 1339',
              '+60 12 915 3527': '+60 12 868 1339',
              '60126413812': '60128681339',
              '+60126413812': '+60128681339',
              '0126413812': '0128681339',
              '012-641 3812': '012-868 1339',
              '012 641 3812': '012 868 1339',
              '+60 12-641 3812': '+60 12-868 1339',
              '+60 12 641 3812': '+60 12 868 1339',
          }

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts or path.parts[:2] == ('.github','workflows'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated files:')
          print('\n'.join(changed))
          PY
      - name: Verify non-Gulf public numbers are gone
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=.github '60129153527|0129153527|12-915[ -]3527|60126413812|0126413812|12-641[ -]3812' .; then
            echo 'Non-Gulf public number found; refusing to commit.'
            exit 1
          fi
      - name: Commit normalized Gulf contact
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No contact replacements required.'
            exit 0
          fi
          git config user.name 'TGPU Gulf Contact Maintenance'
          git config user.email 'mamduh@tgpugulf.com'
          git add -A
          git commit -m 'Remove personal number and standardize TGPU Gulf contact'
          git push origin HEAD:main
