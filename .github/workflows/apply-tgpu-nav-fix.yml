name: Apply visible TGPU Gulf navigation logo fix

on:
  push:
    paths:
      - '.github/workflows/apply-tgpu-nav-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch navbar to dedicated horizontal logo and bust image cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('tgpu-gulf-brand.webp?v=20260921-header', 'tgpu-gulf-header.svg?v=20260921-nav2')
          text = text.replace('tgpu-gulf-brand.webp?v=20260921-hero', 'tgpu-gulf-brand.webp?v=20260921-refined2')
          text = text.replace('https://tgpugulf.com/tgpu-gulf/tgpu-gulf-brand.webp?v=20260921', 'https://tgpugulf.com/tgpu-gulf/tgpu-gulf-brand.webp?v=20260921-refined2')
          text = text.replace('tgpu-gulf-brand.webp?v=20260921-icon', 'tgpu-gulf-brand.webp?v=20260921-refined2-icon')
          text = text.replace('.brand img{width:136px;height:82px;object-fit:contain;object-position:left center;flex:0 0 136px}', '.brand img{width:220px;height:52px;object-fit:contain;object-position:left center;flex:0 0 220px}')
          text = text.replace('.brand img{width:112px;height:68px;flex-basis:112px}', '.brand img{width:170px;height:42px;flex-basis:170px}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit navbar correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Gulf Navigation Fix'
          git config user.email 'mamduh@tgpugulf.com'
          git add index.html
          git commit -m 'Use dedicated TGPU Gulf navbar logo and bust cache'
          git push origin HEAD:main
