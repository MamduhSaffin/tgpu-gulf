name: Deploy TGPU Gulf to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deployment refresh: 2026-09-26

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify permanent approved branding
        run: |
          set -euo pipefail

          # Permanent approved asset only: no expiring Drive URLs and no image conversion.
          test -s tgpu-gulf-approved.png
          test -s index.html

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          approved = 'https://tgpugulf.com/tgpu-gulf-approved.png'

          # Keep the approved green/gold logo already used in the visible header/hero.
          s = re.sub(r'(<meta property="og:image" content=")[^"]+("[^>]*>)', r'\1' + approved + r'\2', s, count=1)
          s = re.sub(r'(<meta name="twitter:image" content=")[^"]+("[^>]*>)', r'\1' + approved + r'\2', s, count=1)
          s = re.sub(r'(<link rel="icon" type="image/png" href=")[^"]+("[^>]*>)', r'\1tgpu-gulf-approved.png\2', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'tgpu-gulf-approved.png' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
