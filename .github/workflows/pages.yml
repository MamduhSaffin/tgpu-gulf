name: Deploy TGPU Gulf to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare approved green-gold branding and social sharing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

          # Use only the approved assets committed in the repository.
          # This avoids expiring temporary links and prevents unapproved replacements.
          test -s tgpu-gulf-approved.png
          test -s tgpu-gulf-approved-banner.webp
          test -s index.html

          # Generate a dedicated green/gold favicon from the approved logo.
          convert tgpu-gulf-approved.png \
            -resize '256x256>' -background '#fffdf8' -gravity center -extent 256x256 -strip \
            tgpu-gulf-favicon-approved-green-gold-20260923.png

          # Generate the social card without cropping the approved 3:1 banner artwork.
          convert tgpu-gulf-approved-banner.webp \
            -resize '1200x630>' -background '#123b2c' -gravity center -extent 1200x630 -strip \
            tgpu-gulf-social-preview-green-gold-20260923.png

          file tgpu-gulf-favicon-approved-green-gold-20260923.png | grep -Eqi 'PNG image data'
          file tgpu-gulf-social-preview-green-gold-20260923.png | grep -Eqi 'PNG image data'

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          banner = '<section class="approved-hero-banner" aria-label="TGPU Gulf approved green and gold banner"><div class="banner-wrap"><img src="tgpu-gulf-approved-banner.webp?v=20260923-visible2" width="1800" height="600" alt="TGPU Gulf — Bridging Malaysia and the GCC" fetchpriority="high" decoding="async"></div></section>'
          style = '<style id="approved-banner-clean">.approved-hero-banner{display:block!important;padding:14px 0 18px!important;background:#fff!important}.approved-hero-banner .banner-wrap{width:min(1600px,calc(100% - 24px))!important;margin:auto!important}.approved-hero-banner img{display:block!important;width:100%!important;height:auto!important;aspect-ratio:3/1!important;object-fit:cover!important;border-radius:20px!important;box-shadow:0 14px 34px rgba(8,41,30,.14)!important}.hero-brand-logo{display:none!important}@media(max-width:640px){.approved-hero-banner{padding:8px 0 12px!important}.approved-hero-banner .banner-wrap{width:calc(100% - 12px)!important}.approved-hero-banner img{border-radius:14px!important}}</style>'
          social = 'https://tgpugulf.com/tgpu-gulf-social-preview-green-gold-20260923.png?v=20260923-social2'
          favicon = 'tgpu-gulf-favicon-approved-green-gold-20260923.png?v=20260923-favicon2'

          # Keep the approved logo in navigation/header.
          s = s.replace('tgpu-gulf-logo-approved-green-gold-20260923.webp', 'tgpu-gulf-approved.png')

          # One clean visible banner, then the existing text-led hero below it.
          s = re.sub(r'<section class="approved-hero-banner".*?</section>', '', s, flags=re.S)
          if '<main id="top">' in s:
              s = s.replace('<main id="top">', '<main id="top">\n' + banner, 1)
          if 'approved-banner-clean' not in s:
              s = s.replace('</head>', style + '</head>', 1)

          s = re.sub(r'(<meta property="og:image" content=")[^"]+("[^>]*>)', r'\1' + social + r'\2', s, count=1)
          s = re.sub(r'(<meta name="twitter:image" content=")[^"]+("[^>]*>)', r'\1' + social + r'\2', s, count=1)
          s = re.sub(r'(<meta property="og:image:width" content=")[^"]+("[^>]*>)', r'\g<1>1200\2', s, count=1)
          s = re.sub(r'(<meta property="og:image:height" content=")[^"]+("[^>]*>)', r'\g<1>630\2', s, count=1)
          s = re.sub(r'(<link rel="icon" type="image/png" href=")[^"]+("[^>]*>)', r'\1' + favicon + r'\2', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'src="tgpu-gulf-approved.png"' index.html
          grep -q 'tgpu-gulf-approved-banner.webp' index.html
          grep -q 'tgpu-gulf-social-preview-green-gold-20260923.png' index.html
          grep -q 'tgpu-gulf-favicon-approved-green-gold-20260923.png' index.html
          grep -q '<section class="approved-hero-banner"' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
