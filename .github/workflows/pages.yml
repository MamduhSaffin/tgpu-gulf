name: Deploy TGPU Gulf to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build banner with the approved TGPU Gulf logo
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert tgpu-gulf-brand.webp -resize '1200x675^' -gravity center -extent 1200x675 /tmp/gulf-base.png
          convert tgpu-gulf-approved.png -trim +repage -resize '205x98>' /tmp/gulf-approved-logo.png
          convert /tmp/gulf-base.png -fill white -draw 'roundrectangle 28,14 514,123 18,18' /tmp/gulf-card.png
          convert /tmp/gulf-card.png /tmp/gulf-approved-logo.png -gravity northwest -geometry +170+19 -composite -quality 90 tgpu-gulf-approved-banner.webp

          # Use the corrected banner both on-page and for WhatsApp/Facebook previews.
          sed -i 's#tgpu-gulf-brand.webp?v=20260922-approved-banner#tgpu-gulf-approved-banner.webp?v=20260922-approved-logo#g' index.html
          sed -i 's#https://tgpugulf.com/tgpu-gulf/tgpu-gulf-brand.webp?v=20260922-approved-banner#https://tgpugulf.com/tgpu-gulf/tgpu-gulf-approved-banner.webp?v=20260922-approved-logo#g' index.html

          test -s tgpu-gulf-approved-banner.webp
          grep -q 'tgpu-gulf-approved-banner.webp' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
