name: Deploy TGPU Gulf to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare TGPU Gulf banner and social metadata
        run: |
          set -euo pipefail

          test -s tgpu-gulf-approved.png
          test -s tgpu-gulf-approved-banner.webp
          test -s index.html

          file tgpu-gulf-approved.png | grep -Eqi 'PNG image data'
          file tgpu-gulf-approved-banner.webp | grep -Eqi 'Web/P image|WebP'

          # The approved wide artwork is for social sharing only.
          # Do not display it as a second homepage hero/banner.
          sed -i '/<section class="approved-hero-banner"/d' index.html

          # Fix Open Graph / Twitter image URLs. The site is deployed at the
          # custom-domain root, so there must not be an extra /tgpu-gulf/ path.
          sed -i 's#https://tgpugulf.com/tgpu-gulf/tgpu-gulf-brand.webp?v=20260922-approved-banner#https://tgpugulf.com/tgpu-gulf-approved-banner.webp?v=20260923-share#g' index.html
          sed -i 's#https://tgpugulf.com/tgpu-gulf/tgpu-gulf-approved-banner.webp?v=20260922-approved-logo#https://tgpugulf.com/tgpu-gulf-approved-banner.webp?v=20260923-share#g' index.html

          grep -q 'https://tgpugulf.com/tgpu-gulf-approved-banner.webp?v=20260923-share' index.html
          ! grep -q 'https://tgpugulf.com/tgpu-gulf/' index.html
          ! grep -q '<section class="approved-hero-banner"' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
