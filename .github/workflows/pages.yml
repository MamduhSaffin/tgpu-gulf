name: Deploy TGPU Gulf to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and activate approved TGPU Gulf banner
        run: |
          set -euo pipefail

          test -s tgpu-gulf-approved.png
          test -s tgpu-gulf-approved-banner.webp

          file tgpu-gulf-approved.png | grep -Eqi 'PNG image data'
          file tgpu-gulf-approved-banner.webp | grep -Eqi 'Web/P image|WebP'

          # Use the already-approved committed artwork.
          # Do not regenerate or recompress image assets during deployment.
          sed -i 's#tgpu-gulf-brand.webp?v=20260922-approved-banner#tgpu-gulf-approved-banner.webp?v=20260922-approved-logo#g' index.html
          sed -i 's#https://tgpugulf.com/tgpu-gulf/tgpu-gulf-brand.webp?v=20260922-approved-banner#https://tgpugulf.com/tgpu-gulf/tgpu-gulf-approved-banner.webp?v=20260922-approved-logo#g' index.html

          grep -q 'tgpu-gulf-approved-banner.webp' index.html
          ! grep -q 'tgpu-gulf-brand.webp?v=20260922-approved-banner' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
