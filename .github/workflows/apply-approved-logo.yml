name: Apply approved TGPU Gulf logo

on:
  push:
    paths:
      - '.github/workflows/apply-approved-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace visible TGPU Gulf logo references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('https://tgpugulf.com/tgpu-gulf/tgpu-gulf-logo.svg?v=20260920-approved', 'https://tgpugulf.com/tgpu-gulf/tgpu-gulf-brand.webp?v=20260921')
          text = text.replace('tgpu-gulf-header.svg?v=20260920-brand', 'tgpu-gulf-brand.webp?v=20260921-header')
          text = text.replace('tgpu-gulf-logo.svg?v=20260920-hero', 'tgpu-gulf-brand.webp?v=20260921-hero')
          text = text.replace('link rel="icon" type="image/svg+xml" href="tgpu-gulf-icon.svg?v=20260920-brand"', 'link rel="icon" type="image/webp" href="tgpu-gulf-brand.webp?v=20260921-icon"')
          text = text.replace('.brand img{width:205px;height:54px;object-fit:contain;object-position:left center;flex:0 0 205px}', '.brand img{width:136px;height:82px;object-fit:contain;object-position:left center;flex:0 0 136px}')
          text = text.replace('.brand img{width:160px;height:44px;flex-basis:160px}', '.brand img{width:112px;height:68px;flex-basis:112px}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit website logo update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Gulf Brand Update'
          git config user.email 'mamduh@tgpugulf.com'
          git add index.html
          git commit -m 'Use approved TGPU Gulf logo across website'
          git push origin HEAD:main
