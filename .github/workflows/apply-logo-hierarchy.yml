name: Apply TGPU Gulf logo hierarchy

on:
  push:
    paths:
      - '.github/workflows/apply-logo-hierarchy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply header, favicon and hero logo hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<link rel="icon" type="image/svg+xml" href="tgpu-gulf-logo.svg?v=20260920-approved">','<link rel="icon" type="image/svg+xml" href="tgpu-gulf-icon.svg?v=20260920-brand">')

          s=s.replace('.brand img{width:82px;height:82px;object-fit:contain;flex:0 0 82px}', '.brand img{width:205px;height:54px;object-fit:contain;object-position:left center;flex:0 0 205px}')
          s=s.replace('.brand img{width:66px;height:66px;flex-basis:66px}', '.brand img{width:160px;height:44px;flex-basis:160px}')

          old_brand='<a class="brand" href="#top"><img src="tgpu-gulf-logo.svg?v=20260920-approved" alt="TGPU Gulf — Malaysia ↔ GCC"><span><strong>TGPU Gulf Advisory & Trade</strong><small>Malaysia ↔ Saudi Arabia & GCC</small></span></a>'
          new_brand='<a class="brand" href="#top" aria-label="TGPU Gulf home"><img src="tgpu-gulf-header.svg?v=20260920-brand" alt="TGPU Gulf — Malaysia ↔ GCC"></a>'
          if old_brand in s:
              s=s.replace(old_brand,new_brand,1)

          if '.hero-brand-logo{' not in s:
              s=s.replace('.hero h1{margin:0;', '.hero-brand-logo{width:min(280px,72vw);height:auto;display:block;margin:0 0 22px;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.20)}.hero h1{margin:0;',1)
              s=s.replace('@media(max-width:620px){', '@media(max-width:620px){.hero-brand-logo{width:min(220px,68vw);margin-bottom:18px}',1)

          hero_marker='<section class="hero"><div class="wrap hero-grid"><div><p class="kicker"'
          hero_repl='<section class="hero"><div class="wrap hero-grid"><div><img class="hero-brand-logo" src="tgpu-gulf-logo.svg?v=20260920-hero" alt="TGPU Gulf — Malaysia ↔ GCC · People · Opportunities · Collaboration"><p class="kicker"'
          if hero_marker in s and 'class="hero-brand-logo"' not in s:
              s=s.replace(hero_marker,hero_repl,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit TGPU Gulf logo hierarchy
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'TGPU Gulf Brand Maintenance'
          git config user.email 'mamduh@tgpugulf.com'
          git add index.html
          git commit -m 'Use compact TGPU Gulf header and full hero logo'
          git push origin HEAD:main
